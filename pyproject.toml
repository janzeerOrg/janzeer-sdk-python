[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janzeer-sdk"
version = "0.1.0"
description = "Official Python SDK of the Janzeer blockchain: wallet keys and signing, transaction builders, REST, JSON-RPC and WebSocket clients."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Janzeer", email = "janzeeer@proton.me" }]
keywords = ["janzeer", "blockchain", "sdk", "wallet", "json-rpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["coincurve>=20", "pycryptodome>=3.20", "httpx>=0.27"]

[project.optional-dependencies]
ws = ["websockets>=13"]
dev = ["websockets>=13", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "build"]

[project.urls]
Homepage = "https://janzeer.org"
Repository = "https://github.com/janzeerorg/janzeer-sdk-python"
Documentation = "https://github.com/janzeerorg/janzeer-sdk-python#readme"
Changelog = "https://github.com/janzeerorg/janzeer-sdk-python/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/janzeer"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["e2e: the conformance flow against a running network (needs JANZEER_NODE_URL)"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/janzeer"]

[[tool.mypy.overrides]]
module = ["coincurve.*", "Crypto.*", "websockets.*"]
ignore_missing_imports = true
