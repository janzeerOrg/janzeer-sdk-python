name: ci
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
        include:
          - { os: macos-latest, python: '3.13' }
          - { os: windows-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      # the vendored conformance vectors must be the published ones, byte for byte
      - name: vectors are unmodified
        if: runner.os != 'Windows'
        run: cd tests/vectors && sha256sum -c SHA256SUMS || shasum -a 256 -c SHA256SUMS
      - run: ruff check .
      - run: mypy
      - run: pytest
      - run: python examples/05_vault_roundtrip.py
      - run: python -m build
