# Publishes janzeer-sdk to PyPI when a GitHub release is published.
# No token anywhere: PyPI trusts this repository + this workflow file + the `pypi` environment (trusted publishing, OIDC).
# The release tag must be v<version> with <version> == [project].version in pyproject.toml.
name: publish
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: tag matches pyproject version
        run: |
          python - "${{ github.event.release.tag_name }}" <<'PY'
          import sys, tomllib
          tag = sys.argv[1]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != f"v{version}":
              sys.exit(f"release tag {tag} != v{version} (pyproject.toml)")
          print(f"janzeer-sdk {version}")
          PY
      - name: vectors are unmodified
        run: cd tests/vectors && sha256sum -c SHA256SUMS
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" twine
      - run: ruff check . && mypy && pytest
      - run: python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/janzeer-sdk/
    permissions:
      id-token: write   # the OIDC token PyPI exchanges for a short-lived upload token
      contents: write   # attach the files to the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
      - name: attach sdist + wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
